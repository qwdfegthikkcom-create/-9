<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<!-- قالب صورة العمل: يأخذ لقطات شاشة حقيقية ويضعها بإطار هاتف أو متصفح على خلفية الهوية.
     يُستخدم من tools/shoot.cjs فقط: ?kind=menu|site|video&a=<صورة1>&b=<صورة2> -->
<style>
  :root { --bg: #2a0d14; --deep: #1e080d; --gold: #d8b266; --soft: rgba(216, 178, 102, .28); }
  * { margin: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 750px; overflow: hidden; }
  body { position: relative; background: radial-gradient(900px 620px at 50% 40%, #4a1624 0%, var(--bg) 55%, var(--deep) 100%); }
  .arch { position: absolute; left: 50%; bottom: -40px; width: 760px; height: 820px; margin-left: -380px;
    border: 3px solid var(--soft); border-radius: 999px 999px 0 0; }
  .arch.in { width: 680px; margin-left: -340px; height: 770px; border-width: 1.5px; opacity: .6; }
  .phone { position: absolute; width: 300px; height: 615px; border-radius: 42px; padding: 9px;
    background: linear-gradient(145deg, #2b1016, #0a0204);
    box-shadow: 0 0 0 2px rgba(216, 178, 102, .65), 0 40px 70px rgba(0, 0, 0, .55); }
  .phone img, .win img { width: 100%; height: 100%; object-fit: cover; object-position: top; display: block; }
  .phone img { border-radius: 34px; }
  .win { position: absolute; left: 130px; top: 70px; width: 820px; height: 560px; border-radius: 14px; overflow: hidden;
    background: #111; box-shadow: 0 0 0 2px rgba(216, 178, 102, .55), 0 40px 80px rgba(0, 0, 0, .55); }
  .win .bar { height: 34px; background: #1b0a0f; display: flex; gap: 9px; align-items: center; padding: 0 16px; direction: ltr; }
  .win .bar i { width: 11px; height: 11px; border-radius: 50%; background: var(--soft); }
  .win .shot { height: calc(100% - 34px); }
  .play { position: absolute; left: 50%; top: 50%; width: 120px; height: 120px; margin: -60px 0 0 -60px; border-radius: 50%;
    background: rgba(216, 178, 102, .92); box-shadow: 0 10px 40px rgba(0, 0, 0, .5); }
  .play::after { content: ""; position: absolute; left: 46px; top: 34px; border-left: 40px solid var(--deep);
    border-top: 26px solid transparent; border-bottom: 26px solid transparent; }
</style>
</head>
<body>
<div class="arch"></div><div class="arch in"></div>
<div id="stage"></div>
<script>
  const q = new URLSearchParams(location.search);
  const kind = q.get('kind') || 'menu', a = q.get('a'), b = q.get('b');
  const stage = document.getElementById('stage');
  const phone = (src, css) => `<div class="phone" style="${css}"><img src="${src}"></div>`;
  if (kind === 'site') {
    stage.innerHTML = `<div class="win"><div class="bar"><i></i><i></i><i></i></div><div class="shot"><img src="${a}"></div></div>`
      + (b ? phone(b, 'left:820px;top:120px;transform:scale(.82) rotate(4deg);transform-origin:50% 0') : '');
  } else if (kind === 'video') {
    stage.innerHTML = phone(a, 'left:450px;top:68px') + '<div class="play"></div>';
  } else if (b) {
    // منيو بلقطتين: الثانية خلف الأولى ومائلة قليلاً
    stage.innerHTML = phone(b, 'left:330px;top:95px;transform:rotate(-7deg) scale(.92);opacity:.92')
      + phone(a, 'left:575px;top:68px;transform:rotate(4deg)');
  } else {
    stage.innerHTML = phone(a, 'left:450px;top:68px');
  }
</script>
</body>
</html>
